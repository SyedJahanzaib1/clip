<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Vault - Syed Jahanzaib</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px 12px;
        }
        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        /* Lock Screen */
        #lock-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .lock-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 36px 28px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--card-border);
        }
        .lock-card h2 { color: var(--accent); margin-bottom: 8px; font-size: 26px; }
        .lock-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
        input[type="password"] {
            width: 100%;
            padding: 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            margin-bottom: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus { border-color: var(--accent); }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:hover { opacity: 0.95; }
        .error-msg { color: var(--danger); font-size: 13px; margin-bottom: 12px; display: none; }

        /* Main Vault Screen */
        #vault-screen { display: none; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 16px;
        }
        .header h1 { color: var(--accent); font-size: 22px; display: flex; align-items: center; gap: 8px; }
        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-logout:hover { background: var(--danger); color: white; }

        /* Input & Dropzone Box */
        .input-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid var(--card-border);
        }
        textarea {
            width: 100%;
            height: 90px;
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            margin-bottom: 14px;
            resize: vertical;
            outline: none;
            font-family: inherit;
        }
        textarea:focus { border-color: var(--accent); }

        /* Drag & Drop Area */
        .dropzone {
            border: 2px dashed rgba(56, 189, 248, 0.3);
            background: rgba(15, 23, 42, 0.4);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 14px;
            transition: border-color 0.2s, background 0.2s;
        }
        .dropzone.dragover {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
        }
        .dropzone p { font-size: 13px; color: var(--text-muted); }
        .dropzone span { color: var(--accent); font-weight: 600; }
        #file-input { display: none; }
        .upload-progress {
            font-size: 13px;
            color: var(--accent);
            margin-top: 8px;
            display: none;
        }

        /* Controls: Search & Tabs */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        @media (min-width: 600px) {
            .controls { flex-direction: row; justify-content: space-between; align-items: center; }
        }
        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 320px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            opacity: 0.6;
        }
        .tabs {
            display: flex;
            gap: 6px;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            overflow-x: auto;
        }
        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent);
            color: white;
            font-weight: 600;
        }

        /* Clip Cards */
        .clip-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 14px;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.2s, transform 0.1s;
        }
        .clip-card:hover { border-color: rgba(255, 255, 255, 0.15); }
        .clip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clip-badge {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
        }
        .badge-file { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge-link { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        
        .clip-text {
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #e2e8f0;
            line-height: 1.5;
        }
        .clip-text a { color: var(--accent); text-decoration: none; }
        .clip-text a:hover { text-decoration: underline; }

        /* Media Previews */
        .media-preview {
            margin-top: 8px;
            border-radius: 10px;
            overflow: hidden;
            max-width: 100%;
        }
        .media-preview img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            cursor: zoom-in;
            display: block;
        }
        .media-preview video {
            width: 100%;
            max-height: 400px;
            border-radius: 10px;
            outline: none;
        }
        .media-preview audio {
            width: 100%;
            margin-top: 4px;
        }
        .file-card-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }
        .file-icon { font-size: 28px; }
        .file-info { flex-grow: 1; overflow: hidden; }
        .file-name { font-size: 14px; font-weight: 600; color: #fff; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .file-size { font-size: 12px; color: var(--text-muted); }

        .clip-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 10px;
        }
        .meta { font-size: 12px; color: var(--text-muted); }
        .meta span { color: var(--accent); font-weight: 600; }
        .actions { display: flex; gap: 8px; }
        .btn-action {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-action:hover { background: var(--success); color: white; }
        .btn-del {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-del:hover { background: var(--danger); color: white; }
        .loading { text-align: center; color: var(--text-muted); padding: 30px; }

        /* Lightbox Modal */
        #lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Lock Screen -->
        <div id="lock-screen">
            <div class="lock-card">
                <h2>🔒 Central Vault</h2>
                <p>Enter Master Password to Access Storage</p>
                <div id="error-msg" class="error-msg">❌ Incorrect Password</div>
                <input type="password" id="pwd-input" placeholder="••••••••" onkeyup="if(event.key==='Enter') unlockVault()">
                <button class="btn-primary" onclick="unlockVault()">Unlock Vault</button>
            </div>
        </div>

        <!-- Main Vault Screen -->
        <div id="vault-screen">
            <div class="header">
                <h1>🔒 Central Storage Vault</h1>
                <button class="btn-logout" onclick="logout()">🚪 Logout</button>
            </div>

            <!-- Input & Upload Form -->
            <div class="input-box">
                <textarea id="clip-input" placeholder="Paste text, code snippets, URLs, or notes..."></textarea>
                
                <div class="dropzone" id="dropzone" onclick="document.getElementById('file-input').click()">
                    <p>📁 Drag & drop <span>Image, Video, Document, or File</span> here</p>
                    <p style="font-size: 11px; margin-top: 4px;">Or click to select file from device</p>
                    <div id="upload-status" class="upload-progress"></div>
                </div>
                <input type="file" id="file-input" onchange="handleFileSelect(event)">

                <button class="btn-primary" onclick="addClipText()">💾 Save to Storage</button>
            </div>

            <!-- Search & Filter Controls -->
            <div class="controls">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search clips & files..." oninput="renderClips()">
                </div>
                <div class="tabs">
                    <button class="tab-btn active" onclick="setTab('all', this)">🌐 All (<span id="cnt-all">0</span>)</button>
                    <button class="tab-btn" onclick="setTab('text', this)">📝 Text & Code</button>
                    <button class="tab-btn" onclick="setTab('link', this)">🔗 Links</button>
                    <button class="tab-btn" onclick="setTab('file', this)">📁 Files & Media</button>
                </div>
            </div>

            <!-- Clips List Container -->
            <div id="clips-list">
                <div class="loading">Loading vault items...</div>
            </div>
        </div>
    </div>

    <!-- Image Lightbox Modal -->
    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="">
    </div>

    <script>
        const REPO = "SyedJahanzaib1/clip";
        const FILE_PATH = "data.json";
        const ENC_TOKEN = "FBEVO31FAXlHOAsmYWZRawMAARdbXlxbH0gPVWByV10VTFQ2CXUAQg==";
        
        let token = "";
        let fileSha = "";
        let clipsData = [];
        let currentTab = "all";

        function xorDecrypt(encoded, key) {
            try {
                const decoded = atob(encoded);
                let res = "";
                for (let i = 0; i < decoded.length; i++) {
                    res += String.fromCharCode(decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return res;
            } catch (e) {
                return "";
            }
        }

        function unlockVault() {
            const pwd = document.getElementById("pwd-input").value;
            const decrypted = xorDecrypt(ENC_TOKEN, pwd);
            
            if (decrypted.startsWith("ghp_")) {
                token = decrypted;
                localStorage.setItem("vault_pwd", pwd);
                document.getElementById("lock-screen").style.display = "none";
                document.getElementById("vault-screen").style.display = "block";
                setupDropzone();
                fetchClips();
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        function logout() {
            localStorage.removeItem("vault_pwd");
            location.reload();
        }

        function setTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderClips();
        }

        function setupDropzone() {
            const dz = document.getElementById("dropzone");
            dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("dragover"); });
            dz.addEventListener("dragleave", () => dz.classList.remove("dragover"));
            dz.addEventListener("drop", (e) => {
                e.preventDefault();
                dz.classList.remove("dragover");
                if (e.dataTransfer.files.length > 0) {
                    uploadFile(e.dataTransfer.files[0]);
                }
            });
        }

        function handleFileSelect(event) {
            if (event.target.files.length > 0) {
                uploadFile(event.target.files[0]);
            }
        }

        async function fetchClips() {
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                    headers: { "Authorization": `token ${token}` }
                });
                if (!res.ok) throw new Error("Failed to load");
                const data = await res.json();
                fileSha = data.sha;
                const contentStr = decodeURIComponent(escape(atob(data.content)));
                clipsData = JSON.parse(contentStr);
                renderClips();
            } catch (e) {
                document.getElementById("clips-list").innerHTML = `<div class="loading" style="color: var(--danger);">Error loading clips: ${e.message}</div>`;
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function renderClips() {
            const listDiv = document.getElementById("clips-list");
            const searchQuery = document.getElementById("search-input").value.toLowerCase();

            document.getElementById("cnt-all").innerText = clipsData.length;

            let filtered = [...clipsData];

            // Tab Filter
            if (currentTab === "text") {
                filtered = filtered.filter(c => !c.file_url && !c.content.startsWith("http"));
            } else if (currentTab === "link") {
                filtered = filtered.filter(c => !c.file_url && c.content.trim().startsWith("http"));
            } else if (currentTab === "file") {
                filtered = filtered.filter(c => c.file_url);
            }

            // Search Filter
            if (searchQuery) {
                filtered = filtered.filter(c => 
                    (c.content && c.content.toLowerCase().includes(searchQuery)) ||
                    (c.file_name && c.file_name.toLowerCase().includes(searchQuery))
                );
            }

            if (!filtered || filtered.length === 0) {
                listDiv.innerHTML = `<div class="loading">No matching items found.</div>`;
                return;
            }
            
            const sorted = [...filtered].reverse();
            let html = "";

            sorted.forEach((c) => {
                const isFile = !!c.file_url;
                const isLink = !isFile && c.content.trim().startsWith("http");
                const mime = c.mime_type || "";
                
                let badgeHtml = isFile ? `<span class="clip-badge badge-file">FILE</span>` : 
                                isLink ? `<span class="clip-badge badge-link">LINK</span>` : 
                                `<span class="clip-badge">TEXT</span>`;

                let bodyHtml = "";

                if (isFile) {
                    const rawUrl = c.file_url;
                    if (mime.startsWith("image/")) {
                        bodyHtml = `
                        <div class="media-preview">
                            <img src="${rawUrl}" alt="${c.file_name}" onclick="openLightbox('${rawUrl}')">
                        </div>
                        <div class="meta" style="margin-top: 8px;">🖼️ <b>${c.file_name}</b> (${formatBytes(c.file_size)})</div>
                        `;
                    } else if (mime.startsWith("video/")) {
                        bodyHtml = `
                        <div class="media-preview">
                            <video controls src="${rawUrl}"></video>
                        </div>
                        <div class="meta" style="margin-top: 8px;">🎥 <b>${c.file_name}</b> (${formatBytes(c.file_size)})</div>
                        `;
                    } else if (mime.startsWith("audio/")) {
                        bodyHtml = `
                        <div class="media-preview">
                            <audio controls src="${rawUrl}"></audio>
                        </div>
                        <div class="meta" style="margin-top: 8px;">🎵 <b>${c.file_name}</b> (${formatBytes(c.file_size)})</div>
                        `;
                    } else {
                        let icon = "📄";
                        if (c.file_name.endsWith(".pdf")) icon = "📕";
                        if (c.file_name.endsWith(".zip") || c.file_name.endsWith(".rar")) icon = "📦";
                        bodyHtml = `
                        <div class="file-card-box">
                            <div class="file-icon">${icon}</div>
                            <div class="file-info">
                                <div class="file-name">${c.file_name}</div>
                                <div class="file-size">${formatBytes(c.file_size)}</div>
                            </div>
                        </div>
                        `;
                    }
                } else {
                    const safeText = c.content.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    if (isLink) {
                        bodyHtml = `<div class="clip-text"><a href="${c.content.trim()}" target="_blank" rel="noopener">${safeText}</a></div>`;
                    } else {
                        bodyHtml = `<div class="clip-text">${safeText}</div>`;
                    }
                }

                const copyPayload = isFile ? c.file_url : c.content;

                html += `
                <div class="clip-card">
                    <div class="clip-header">
                        ${badgeHtml}
                        <div class="meta">${c.created_at}</div>
                    </div>
                    ${bodyHtml}
                    <div class="clip-footer">
                        <div class="meta">Source: <span>${c.device_source || 'Web'}</span></div>
                        <div class="actions">
                            ${isFile ? `<a href="${c.file_url}" target="_blank" download="${c.file_name}" class="btn-action">📥 Download</a>` : ''}
                            <button class="btn-action" onclick="copyText(\`${encodeURIComponent(copyPayload)}\`, this)">📋 Copy</button>
                            <button class="btn-del" onclick="deleteClip(${c.id})">🗑️</button>
                        </div>
                    </div>
                </div>
                `;
            });

            listDiv.innerHTML = html;
        }

        function openLightbox(url) {
            document.getElementById("lightbox-img").src = url;
            document.getElementById("lightbox").style.display = "flex";
        }

        function copyText(encodedText, btn) {
            const text = decodeURIComponent(encodedText);
            navigator.clipboard.writeText(text).then(() => {
                btn.innerText = "✅ Copied!";
                setTimeout(() => {
                    btn.innerText = "📋 Copy";
                }, 2000);
            });
        }

        async function addClipText() {
            const input = document.getElementById("clip-input");
            const content = input.value.trim();
            if (!content) return;

            const now = new Date();
            const timeStr = now.toISOString().replace("T", " ").substring(0, 19);

            const newItem = {
                id: Date.now(),
                content: content,
                device_source: "GitHub Vault Web",
                created_at: timeStr
            };

            clipsData.push(newItem);
            input.value = "";
            renderClips();

            await saveToGitHub();
        }

        async function uploadFile(file) {
            const statusDiv = document.getElementById("upload-status");
            statusDiv.style.display = "block";
            statusDiv.innerText = `⏳ Uploading ${file.name} (${formatBytes(file.size)})...`;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const base64Content = e.target.result.split(',')[1];
                    const safeName = Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
                    const uploadPath = `uploads/${safeName}`;

                    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${uploadPath}`, {
                        method: "PUT",
                        headers: {
                            "Authorization": `token ${token}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            message: `Upload file ${file.name}`,
                            content: base64Content
                        })
                    });

                    if (!res.ok) throw new Error("Upload failed on GitHub");
                    const resData = await res.json();
                    
                    const rawUrl = `https://syedjahanzaib1.github.io/clip/${uploadPath}`;

                    const now = new Date();
                    const timeStr = now.toISOString().replace("T", " ").substring(0, 19);

                    const newItem = {
                        id: Date.now(),
                        content: file.name,
                        file_url: rawUrl,
                        file_name: file.name,
                        file_size: file.size,
                        mime_type: file.type,
                        device_source: "GitHub Vault Web Upload",
                        created_at: timeStr
                    };

                    clipsData.push(newItem);
                    statusDiv.style.display = "none";
                    renderClips();

                    await saveToGitHub();
                } catch (err) {
                    statusDiv.innerText = `❌ Error: ${err.message}`;
                }
            };
            reader.readAsDataURL(file);
        }

        async function deleteClip(id) {
            clipsData = clipsData.filter(c => c.id !== id);
            renderClips();
            await saveToGitHub();
        }

        async function saveToGitHub() {
            try {
                const jsonStr = JSON.stringify(clipsData, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(jsonStr)));
                
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: "Update vault clips via GitHub Pages",
                        content: encodedContent,
                        sha: fileSha
                    })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    fileSha = data.content.sha;
                }
            } catch (e) {
                console.error("Save failed", e);
            }
        }

        window.onload = () => {
            const savedPwd = localStorage.getItem("vault_pwd");
            if (savedPwd) {
                document.getElementById("pwd-input").value = savedPwd;
                unlockVault();
            }
        };
    </script>
</body>
</html>
